# Network-Rules · iOS / Shadowrocket
# 分流来源为同仓库 mihomo.yaml 与 rules/。修改源文件可重新生成本文件。
# 首次设置：在首页将机场订阅备注设为 WgetCloud，添加本地 SOCKS5 节点「🏠 ISP 出口」。
# 在 ISP 节点详情的「代理通过」中指定机场入口，并在首页选中 ISP 节点。
# 首次启动若机场入口的域名解析依赖代理自身，请使用机场提供的入口 IP，并保留原 TLS/SNI 设置。
[General]
update-url = https://raw.githubusercontent.com/mrlangchen/Network-Rules/main/Shadowrocket.conf
bypass-system = false
skip-proxy = localhost,127.0.0.1
tun-excluded-routes = 127.0.0.0/8
ipv6 = false
prefer-ipv6 = false
dns-server = https://1.1.1.1/dns-query#proxy=%F0%9F%8F%A0%20ISP%20%E5%87%BA%E5%8F%A3,https://8.8.8.8/dns-query#proxy=%F0%9F%8F%A0%20ISP%20%E5%87%BA%E5%8F%A3
direct-dns-server = https://1.1.1.1/dns-query#proxy=%F0%9F%8F%A0%20ISP%20%E5%87%BA%E5%8F%A3,https://8.8.8.8/dns-query#proxy=%F0%9F%8F%A0%20ISP%20%E5%87%BA%E5%8F%A3
fallback-dns-server = https://8.8.8.8/dns-query#proxy=%F0%9F%8F%A0%20ISP%20%E5%87%BA%E5%8F%A3
proxy-dns-server = https://1.1.1.1/dns-query#proxy=%F0%9F%8F%A0%20ISP%20%E5%87%BA%E5%8F%A3,https://8.8.8.8/dns-query#proxy=%F0%9F%8F%A0%20ISP%20%E5%87%BA%E5%8F%A3
dns-direct-system = false
dns-fallback-system = false
dns-direct-fallback-proxy = false
hijack-dns = 8.8.8.8:53,8.8.4.4:53,1.1.1.1:53,1.0.0.1:53,9.9.9.9:53,208.67.222.222:53,208.67.220.220:53,223.5.5.5:53,223.6.6.6:53,119.29.29.29:53,114.114.114.114:53
private-ip-answer = true
udp-policy-not-supported-behaviour = REJECT
close-if-proxy-chain-missing = true

