name: Sync Shadowrocket config

on:
  push:
    branches: [main]
    paths:
      - mihomo.yaml
      - 'rules/**'
      - scripts/sync-shadowrocket.rb
      - .github/workflows/sync-shadowrocket.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-shadowrocket-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
      - name: Rebuild from the latest main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git switch --detach FETCH_HEAD
            ruby scripts/sync-shadowrocket.rb
            git add -- Shadowrocket.conf
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Sync Shadowrocket config with Mihomo'
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
